<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube 音声保存</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f4f7fb; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
  .box { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
  input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
  button { width: 100%; padding: 14px; background: #0066ff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h2>YouTube 音声ダウンローダー</h2>
  <input type="url" id="url" placeholder="https://youtu.be/...">
  <button onclick="download()">音声を保存</button>
</div>
<script>
function download() {
  const url = document.getElementById('url').value.trim();
  if (!url) return alert('URLを入力してください');
  window.location.href = `/api/download?url=${encodeURIComponent(url)}`;
}
</script>
</body>
</html>
